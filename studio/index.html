<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#151413">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Studio · Sihao Chen</title>
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../img/icon-192.png">
<link rel="apple-touch-icon" href="../img/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Studio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/style.css?v=1794519507">
<style>
  body { min-height: 100vh }
  .st { max-width: 560px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 60px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px }
  .st h1 { font-size: 30px; margin: 4px 0 0 }
  .st .lead { margin: 0; color: var(--ink-soft) }
  .box { background: var(--rubber); border-radius: 14px; padding: 16px; display: grid; gap: 12px }
  .box h2 { font: 400 24px var(--display); margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 10px }
  .pill { font: 500 12px var(--mono); padding: 5px 10px; border-radius: 999px; background: var(--ink); color: var(--paper); white-space: nowrap }
  .pill.off { background: var(--red); color: #fff }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center }
  .nums div { background: var(--paper); border-radius: 10px; padding: 10px 4px }
  .nums b { display: block; font: 400 30px/1.1 var(--display) }
  .nums span { font: 500 11px var(--mono); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em }
  .nums .todo b { color: var(--red) }
  .plus { font: 400 26px var(--display); padding: 18px; border-radius: 14px; border: 0; background: var(--ink); color: var(--paper); cursor: pointer; width: 100%; touch-action: manipulation }
  .plus:disabled { opacity: .45 }
  .undo { justify-self: start; font: 500 14px var(--mono); background: none; border: 1px solid var(--line); color: var(--ink-soft); border-radius: 999px; padding: 8px 14px; cursor: pointer }
  .toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 999px; font: 500 15px var(--body); max-width: 90vw }
  .list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font: 400 14px var(--mono); color: var(--ink-soft) }
  .list li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; overflow-wrap: anywhere }
  .err { color: var(--red) }
  .stats { width: 100%; border-collapse: collapse; font: 400 14px var(--mono) }
  .stats th, .stats td { padding: 7px 4px; text-align: right; border-bottom: 1px dashed var(--line) }
  .stats th:first-child, .stats td:first-child { text-align: left; color: var(--ink-soft) }
  .stats td b { font: 400 20px var(--display) }
  .stats tr.paid td b { color: var(--red) }
  .small { margin: 0; font-size: 13px; color: var(--ink-soft) }
</style>
</head>
<body>
<main class="st" id="app">
  <h1>Studio</h1>
  <p class="lead">Loading…</p>
</main>
<div class="toast" id="toast" hidden></div>
<script>
/* Sihao's private counter. Tap "+1 carved" after carving each stamp; the shop's ship times follow. */
const API = "https://sihaochen-checkout.sihaochen599.workers.dev/studio";
// The key comes from the private link (#key). Once opened with it, this device remembers it,
// so the page also opens from a home screen icon or a link that lost the #key part.
const KEY = (() => {
  const h = decodeURIComponent(location.hash.slice(1));
  try { if (h) localStorage.setItem("studio_key", h); return h || localStorage.getItem("studio_key") || ""; } catch (_) { return h; }
})();
try { if (KEY) localStorage.setItem("sc_notrack", "1"); } catch (_) {} // don't count Sihao's own visits
const NAMES = { mf: "Middle Finger", ah: "AHHHHH" };
const app = document.getElementById("app"), toast = document.getElementById("toast");
let lastAction = null, toastTimer = 0;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = t => new Date(t).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

async function call(body = {}) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: KEY, ...body }) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Something went wrong");
  return d;
}
function say(text) {
  toast.textContent = text; toast.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.hidden = true, 4000);
}
function render(d) {
  const groups = Object.keys(d.production?.units || NAMES);
  app.innerHTML = `<h1>Studio</h1>
    <p class="lead">Tap <b>+1 carved</b> each time you finish a stamp. The shop updates its ship time by itself.</p>
    ${groups.map(g => {
      const carved = d.carved[g] || 0, paid = d.taken[g] || 0, todo = Math.max(0, paid - carved), s = d.ship[g] || {};
      return `<section class="box">
        <h2>${NAMES[g] || g}<span class="pill${s.open === false ? " off" : ""}">${s.open === false ? "Paused · queue full" : `Shop says: ${s.weeks || 1} week${(s.weeks || 1) > 1 ? "s" : ""}`}</span></h2>
        <div class="nums"><div><b>${paid}</b><span>paid</span></div><div><b>${carved}</b><span>carved</span></div><div class="todo"><b>${todo}</b><span>to carve</span></div></div>
        <button class="plus" data-g="${g}" type="button">+1 carved</button>
        <button class="undo" data-undo="${g}" type="button">Undo last for ${NAMES[g] || g}</button>
      </section>`;
    }).join("")}
    ${statsBox(d.stats)}
    <section class="box"><h2>Recent</h2>
      <ul class="list">${d.log.length ? d.log.map(x => `<li><span>${NAMES[x.g] || x.g} ${x.d > 0 ? "+1" : "−1"} → ${x.n}</span><span>${when(x.t)}</span></li>`).join("") : "<li>Nothing yet</li>"}</ul></section>
    <section class="box"><h2>Waitlist <span class="pill">${d.waitlist.length}</span></h2>
      <ul class="list">${d.waitlist.length ? d.waitlist.map(x => `<li><span>${esc(x.email)}</span><span>${esc(x.product)} · ${when(x.t)}</span></li>`).join("") : "<li>No one yet</li>"}</ul>
      ${d.waitlist.length ? `<button class="undo" id="copy" type="button">Copy all emails</button>` : ""}</section>`;
  app.querySelectorAll("[data-g]").forEach(b => b.addEventListener("click", () => tap(b, b.dataset.g, 1)));
  app.querySelectorAll("[data-undo]").forEach(b => b.addEventListener("click", () => tap(b, b.dataset.undo, -1)));
  const copy = document.getElementById("copy");
  if (copy) copy.addEventListener("click", () => {
    const text = [...new Set(d.waitlist.map(x => x.email))].join(", ");
    navigator.clipboard?.writeText(text).then(() => say("Emails copied"), () => say(text));
  });
}
// Visits report: anonymous counts from the shop (your own visits on this phone are not counted).
function statsBox(s) {
  if (!s) return "";
  if (s.error) return `<section class="box"><h2>Visitors</h2><p class="err">${esc(s.error)}</p></section>`;
  const rows = [["Visitors", "visitors"], ["Page views", "views"], ["Added to cart", "cart"], ["Clicked checkout", "checkout"], ["Paid orders", "paid"]];
  const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "–";
  const w = s.d7 || {};
  return `<section class="box"><h2>Visitors</h2>
    <table class="stats"><tr><th></th><th>24 h</th><th>7 days</th><th>30 days</th></tr>
      ${rows.map(([label, k]) => `<tr${k === "paid" ? ' class="paid"' : ""}><td>${label}</td>${["d1", "d7", "d30"].map(r => `<td><b>${(s[r] || {})[k] || 0}</b></td>`).join("")}</tr>`).join("")}
    </table>
    <p class="small">Last 7 days: ${pct(w.cart, w.visitors)} of visitors added to cart, ${pct(w.paid, w.checkout)} of checkout clicks paid.</p>
    ${s.top?.length ? `<b style="font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.04em">Top pages · 7 days</b>
      <ul class="list">${s.top.map(x => `<li><span>${esc(x.p || "/")}</span><span>${x.n}</span></li>`).join("")}</ul>` : ""}
    <p class="small">More detail (where visitors come from, countries, phones vs computers): <a href="https://dash.cloudflare.com/3ff2a86884d70b8aa4884d6942720f36/web-analytics" target="_blank" rel="noopener">Cloudflare Web Analytics</a></p>
  </section>`;
}
async function tap(btn, g, delta) {
  // Lock all buttons briefly so a double tap can't count twice.
  app.querySelectorAll("button").forEach(b => b.disabled = true);
  try {
    const d = await call({ group: g, delta });
    render(d);
    say(`${NAMES[g] || g}: ${d.carved[g] || 0} carved${delta < 0 ? " (undone)" : ""}`);
  } catch (e) { say(e.message); app.querySelectorAll("button").forEach(b => b.disabled = false); }
}
(async () => {
  if (!KEY) { app.innerHTML = `<h1>Studio</h1><p class="err">Open this page with your private link.</p>`; return; }
  try { render(await call()); } catch (e) {
    if (/wrong link/i.test(e.message)) try { localStorage.removeItem("studio_key"); } catch (_) {}
    app.innerHTML = `<h1>Studio</h1><p class="err">${esc(e.message)}</p>`;
  }
})();
</script>
</body>
</html>
